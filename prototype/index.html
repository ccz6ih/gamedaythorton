<!DOCTYPE html>
<html lang="en" data-surface="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Pilot build. Never indexed, never linked publicly. docs/06-architecture.md -->
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Gameday Thornton — Pilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d7262f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="app">
  <!-- Skeleton, replaced on first render. Matches the final layout so the
       first paint does not jump. -->
  <div class="pilot-banner">Pilot — synthetic data only</div>
  <div class="shell">
    <div class="rail"><div class="skel" style="height:30px;margin-bottom:1.5rem"></div>
      <div class="skel" style="height:14px;margin:.6rem 0"></div>
      <div class="skel" style="height:14px;margin:.6rem 0"></div>
      <div class="skel" style="height:14px;margin:.6rem 0"></div></div>
    <div class="main"><div class="view">
      <div class="skel" style="height:28px;width:40%;margin-bottom:1.5rem"></div>
      <div class="grid g4"><div class="skel" style="height:104px"></div><div class="skel" style="height:104px"></div>
      <div class="skel" style="height:104px"></div><div class="skel" style="height:104px"></div></div>
    </div></div>
  </div>
</div>

<noscript>
  <div style="padding:2rem;font-family:system-ui,sans-serif;color:#f5f5f5;background:#141414">
    <h1>JavaScript is required</h1>
    <p>This prototype renders entirely in the browser so it can run from a file with no install
    and no server. Enable JavaScript and reload.</p>
  </div>
</noscript>

<!--
  Load order matters and there are no modules on purpose: classic scripts work
  from a double-clicked file:// URL, which is the whole point of this build —
  anyone can open it without Node, npm, or a dev server.

    demo-data.js   generated by scripts/generate-fixtures.cjs
    store.js       demo clock, write overlay, every derived metric
    charts.js      dependency-free SVG charts
    media.js       image ingestion, placeholders (needs store)
    brand.js       Brand Kit (needs store + media)
    ui.js          shell, router, actions
    screens-*.js   register their routes against ui
    boot.js        first render
-->
<script src="demo-data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/media.js"></script>
<script src="assets/brand.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/screens-patient.js"></script>
<script src="assets/screens-staff.js"></script>
<script src="assets/screens-settings.js"></script>
<script src="assets/boot.js"></script>

</body>
</html>
