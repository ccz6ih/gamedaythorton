<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Med Bar">
  <!--
    A favicon has to survive being 16 pixels wide on both a light and a dark
    browser tab.

    The practice's own logo is a white stacked lockup on transparent — three
    words over each other. At 16px each of those words is roughly two pixels
    tall, and on a light tab bar white-on-transparent is invisible. Pointing the
    favicon at it, which is what the metadata did first, produced a blank square
    for anybody not using dark mode.

    So this is drawn instead: her green ground, her gold, and the two letters
    that still read at 16px. It carries her colours rather than her mark, which
    is the correct trade at this size — the mark is unrecognisable there anyway,
    and the colours are what somebody spots in a row of pinned tabs.
  -->
  <rect width="64" height="64" rx="14" fill="#0E1711"/>
  <rect x="3" y="3" width="58" height="58" rx="11.5" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-opacity=".55"/>
  <text x="32" y="43"
        font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
        font-size="31" font-weight="600" letter-spacing="-0.5"
        text-anchor="middle" fill="#C9A227">MB</text>
</svg>
